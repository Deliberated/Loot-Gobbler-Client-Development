plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = '0.6.8'

repositories {
    mavenCentral()
}

// RealmShark (the sniffing engine) is compiled straight from the unmodified upstream copy in vendor/.
sourceSets.main.java.srcDirs += 'vendor/RealmShark-realmshark/src/main/java'

dependencies {
    implementation 'com.ardikars.pcap:pcap-spi:1.4.2'
    implementation 'com.ardikars.pcap:pcap-jdk7:1.4.2'
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'com.google.flatbuffers:flatbuffers-java:23.5.26'
    implementation 'com.formdev:flatlaf:3.5.4'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

// tomato.version.Version is generated from `version` above, so the version is set in one place only. The release
// tag on GitHub must be "v" + version (e.g. v0.5.0): the in-app updater compares the two.
def versionSrc = layout.buildDirectory.dir('generated/sources/version').get().asFile
def generateVersion = tasks.register('generateVersion') {
    inputs.property 'version', project.version
    outputs.dir versionSrc
    doLast {
        def f = new File(versionSrc, 'tomato/version/Version.java')
        f.parentFile.mkdirs()
        f.text = """package tomato.version;

/**
 * Generated by build.gradle (task generateVersion). Change the version there.
 */
public class Version {
    public static final String VERSION = "v${project.version}";
}
"""
    }
}
sourceSets.main.java.srcDir(generateVersion.map { versionSrc })

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'tomato.Tomato'
    applicationDefaultJvmArgs = ['-Xmx1g', '-XX:+UseG1GC', '-XX:G1PeriodicGCInterval=60000', '-XX:MinHeapFreeRatio=10',
                                 '-XX:MaxHeapFreeRatio=30']
}

// `gradlew run` works from the project root, so assets/ and realmShark.properties live there.
tasks.named('run') {
    workingDir = projectDir
}

shadowJar {
    archiveFileName = "LootGobbler-${project.version}.jar"
}

// `gradlew packageExe`: build/dist/LootGobbler/LootGobbler.exe with its own Java runtime (no Java install needed),
// plus build/dist/LootGobbler-portable.zip to share. The exe keeps its data files next to itself.
// File names carry no version: the GitHub Release tag does, so .../releases/latest/download/<file> links stay valid.
def distDir = layout.buildDirectory.dir('dist').get().asFile
def exeInput = layout.buildDirectory.dir('jpackage-input').get().asFile
def appIcon = file('src/main/resources/icon/lootgobbler.ico')

tasks.register('packageExe', Exec) {
    group = 'distribution'
    description = 'Builds the LootGobbler.exe folder and zip with jpackage.'
    dependsOn tasks.named('shadowJar')
    doFirst {
        delete distDir, exeInput
        copy {
            from tasks.named('shadowJar')
            into exeInput
        }
        // native DLLs shipped in app\natives, so FlatLaf and JNA don't unpack them into %TEMP% at every start
        copy {
            from(zipTree(tasks.named('shadowJar').get().archiveFile)) {
                include 'com/formdev/flatlaf/natives/flatlaf-windows-x86_64.dll', 'com/sun/jna/win32-x86-64/jnidispatch.dll'
                eachFile { path = name }
                includeEmptyDirs = false
            }
            into new File(exeInput, 'natives')
        }
    }
    // nothing is written outside the exe's folder: no perf data in %TEMP%, natives loaded from app\natives
    // memory: 1 GB at most (it needs a few hundred MB); G1 gives unused memory back to Windows when idle
    def javaOptions = ['-Xmx1g', '-XX:+UseG1GC', '-XX:G1PeriodicGCInterval=60000', '-XX:MinHeapFreeRatio=10',
                       '-XX:MaxHeapFreeRatio=30', '-XX:-UsePerfData', '-Dflatlaf.nativeLibraryPath=$APPDIR\\natives',
                       '-Djna.boot.library.path=$APPDIR\\natives', '-Djna.nounpack=true']
    def cmd = ['jpackage', '--type', 'app-image', '--name', 'LootGobbler', '--app-version', project.version,
               '--vendor', 'Pluribus Guild', '--description', 'Loot Gobbler - your right hand for your RotMG adventures',
               '--input', exeInput.path, '--main-jar', "LootGobbler-${project.version}.jar",
               '--main-class', 'tomato.Tomato', '--dest', distDir.path]
    javaOptions.each { cmd += ['--java-options', it] }
    if (appIcon.exists()) cmd += ['--icon', appIcon.path]
    commandLine cmd
    doLast {
        copy {
            from 'LICENSE', 'THIRD_PARTY_LICENSE-RealmShark.md', 'src/main/resources/fonts/OFL-Jersey10.txt',
                    'src/main/resources/fonts/OFL-Jersey15.txt'
            into new File(distDir, 'LootGobbler')
        }
        ant.zip(destfile: new File(distDir, 'LootGobbler-portable.zip').path) {
            zipfileset(dir: new File(distDir, 'LootGobbler').path, prefix: 'LootGobbler')
        }
    }
}

// `gradlew packageInstaller`: build/dist/LootGobbler.exe, a setup that installs the app image from packageExe.
// Needs the WiX Toolset 3.x on PATH. Installs per user (no admin prompt) into %APPDATA%\LootGobbler by default, or a
// folder picked in the setup; packaging/windows/main.wxs adds that default, an info page and "Start Loot Gobbler now".
// Keep the upgrade UUID fixed so a new version replaces the old one.
def installerDir = layout.buildDirectory.dir('jpackage-installer').get().asFile

tasks.register('packageInstaller', Exec) {
    group = 'distribution'
    description = 'Builds the LootGobbler.exe installer with jpackage and WiX.'
    dependsOn tasks.named('packageExe')
    doFirst { delete installerDir }
    def cmd = ['jpackage', '--type', 'exe', '--name', 'LootGobbler', '--app-version', project.version,
               '--vendor', 'Pluribus Guild', '--description', 'Loot Gobbler - your right hand for your RotMG adventures',
               '--app-image', new File(distDir, 'LootGobbler').path, '--dest', installerDir.path,
               '--resource-dir', file('packaging/windows').path,
               '--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-menu-group', 'Loot Gobbler',
               '--win-shortcut', '--win-shortcut-prompt', '--win-upgrade-uuid', 'b20633db-0c63-4148-89bb-1fc7c049d5a3']
    // the setup exe's own icon (and the one in "Installed apps"); without it the setup shows the Java icon
    if (appIcon.exists()) cmd += ['--icon', appIcon.path]
    commandLine cmd
    doLast {
        copy {
            from installerDir
            include '*.exe'
            into distDir
            rename { 'LootGobbler.exe' }
        }
    }
}
