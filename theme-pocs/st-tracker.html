<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ST Tracker POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F3EBD3; --sand:#E6D9B4; --header:#D8C690; --line:#A89150; --ink:#2E2412; --inkSoft:#6B5526; --inkMuted:#9C8656;
          --accent:#C8901C; --accentDark:#8A6210; --onAccent:#000; --red:#C2344E; --title:#FBF5E4; --titleFg:#6B5526; --outside:#3F2716; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--outside); font-family: 'VT323', monospace; font-size: 17px; color: var(--ink); }
  .px { font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .note { max-width: 1100px; margin: 0 auto 10px; color: #f3ebd3; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .note select { font-family: inherit; font-size: 16px; }
  .window { max-width: 1100px; margin: 0 auto; border: 1px solid var(--line); background: var(--sand); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .titlebar { display: flex; gap: 14px; padding: 6px 12px; background: var(--title); color: var(--titleFg); }
  .titlebar .t { flex: 1; text-align: center; font-size: 18px; }
  .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tab { padding: 8px 12px; border-right: 1px solid #000; color: var(--inkSoft); white-space: nowrap; }
  .tab.on { background: var(--paper); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .wrap { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg.joined { gap: 0; }
  .seg button { font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px;
                border: 1px solid var(--line); background: var(--paper); color: var(--inkSoft); cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--onAccent); border-color: #000; }
  .cols { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .section { border: 1px solid var(--line); background: var(--paper); min-width: 0; }
  .main { flex: 1 1 560px; }
  .side { flex: 0 1 260px; display: flex; flex-direction: column; gap: 8px; }
  .head { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 10px; background: var(--header); border-bottom: 1px solid var(--line); color: var(--inkSoft); flex-wrap: wrap; }
  .head .grow { flex: 1; }
  .sq { width: 8px; height: 8px; display: inline-block; flex: none; }
  .head select { font-family: 'VT323', monospace; font-size: 15px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; padding: 10px; max-height: 600px; overflow-y: auto; }
  .card { background: var(--header); border: 1px solid #000; display: grid; grid-template-columns: 72px 1fr; gap: 4px 10px; padding: 6px 10px 6px 6px; }
  .card.done { background: color-mix(in srgb, var(--accent) 45%, var(--paper)); border: 2px solid var(--accent); padding: 5px 9px 5px 5px; }
  .skin { grid-row: 1 / span 3; width: 72px; height: 72px; display: grid; place-items: center; align-self: center; }
  .skin img { width: 64px; height: 64px; image-rendering: pixelated; }
  .card .name { font-size: 18px; text-decoration: underline; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--inkMuted); }
  .card.done .meta { color: var(--ink); }
  .tag { background: var(--accent); color: var(--onAccent); padding: 0 5px; }
  .pieces { display: grid; grid-template-columns: repeat(4, 44px); gap: 6px; justify-content: start; }
  .slotname { font-size: 13px; text-align: center; color: var(--inkSoft); }
  .piece { width: 44px; height: 44px; background: #050505; border: 1px solid #000; display: grid; place-items: center; }
  .piece img { width: 32px; height: 32px; image-rendering: pixelated; }
  .piece.have { background: color-mix(in srgb, var(--accent) 70%, #fff6c0); }
  .piece.miss img { opacity: .25; }
  .piece:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bar { height: 8px; background: var(--line); }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .inner { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .small { font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--inkMuted); }
  .close { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .close img { width: 22px; height: 22px; image-rendering: pixelated; opacity: .5; background: #050505; }
  .close .n { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .clsrow { display: grid; grid-template-columns: 1fr auto 60px; gap: 8px; align-items: center; font-size: 15px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; background: var(--line); }
  .status .grow { flex: 1; }
  .status button { font-family: 'Silkscreen', monospace; font-size: 10px; padding: 5px 10px; border: 1px solid #000; background: var(--accent); color: var(--onAccent); }
</style>
</head>

<div class="note">

</div>

  <div class="wrap">

      <div class="section main">
        <div class="head px">
          <span class="sq" style="background:var(--accent)"></span><span class="grow">Collection &middot; ST Sets</span>
          <select id="cls"></select>
          <div class="seg joined" id="filter"></div>
        </div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="side">
        <div class="section"><div class="head px"><span class="sq" style="background:#3C9347"></span>Set Progress</div>
          <div class="inner" id="progress"></div></div>
        <div class="section"><div class="head px"><span class="sq" style="background:#2D7AB0"></span>Almost Complete</div>
          <div class="inner" id="close"></div></div>
        <div class="section"><div class="head px"><span class="sq" style="background:#8049A8"></span>By Class</div>
          <div class="inner" id="byclass"></div></div>
      </div>
    </div>
  </div>
  <div class="status px"><span class="sq" style="background:#3C9347;width:10px;height:10px"></span><span class="grow">Sniffing</span><button>Stop sniffer</button></div>
</div>

const SLOTS = ['Weapon','Ability','Armor','Ring'];
let filter = 'All', cls = 'All classes';

const owned = s => s.pieces.filter(p => p.owned).length;
const img = id => ICONS[id] ? `<img src="data:image/png;base64,${ICONS[id]}" alt="">` : '';
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function render() {
  const list = SETS.filter(s => (cls === 'All classes' || s.cls === cls) && (
      filter === 'All' || (filter === 'Complete' && owned(s) === 4) ||
      (filter === 'In progress' && owned(s) > 0 && owned(s) < 4) || (filter === 'Missing' && owned(s) === 0)))
    .sort((a, b) => owned(b) - owned(a) || a.name.localeCompare(b.name));
  document.getElementById('cards').innerHTML = list.map(s => {
    const n = owned(s), done = n === 4;
    return `<div class="card${done ? ' done' : ''}" title="${esc(s.name)}\n${esc(s.bonus)}">
      <div class="skin">${s.skin ? img(s.skin) : ''}</div>
      <div class="name">${esc(s.title)}</div>
      <div class="pieces">${SLOTS.map(x => `<span class="slotname">${x}</span>`).join('')}${s.pieces.map((p, i) =>
        `<div class="piece ${p.owned ? 'have' : 'miss'}" title="${esc(p.name)} (${SLOTS[i]}${p.owned ? '' : ' - missing'})">${img(p.id)}</div>`).join('')}</div>
      <div class="meta"><span><span class="sq" style="background:${CLASS_COLORS[s.cls] || '#645D4E'}"></span> ${s.cls}</span>
        ${done ? '<span class="tag px">Complete</span>' : `<span>${n} / 4</span>`}</div>
    </div>`;
  }).join('') || '<div style="color:var(--inkMuted)">No sets match.</div>';

  const complete = SETS.filter(s => owned(s) === 4).length;
  const pieces = SETS.reduce((a, s) => a + owned(s), 0), total = SETS.length * 4;
  document.getElementById('progress').innerHTML = `
    <div class="small">Sets complete</div><div class="bar"><i style="width:${100 * complete / SETS.length}%"></i></div>
    <div>${complete} / ${SETS.length} &nbsp; ${(100 * complete / SETS.length).toFixed(1)}%</div>
    <div class="small">Pieces collected</div><div class="bar"><i style="width:${100 * pieces / total}%;background:#3C9347"></i></div>
    <div>${pieces} / ${total} &nbsp; ${(100 * pieces / total).toFixed(1)}%</div>`;

  document.getElementById('close').innerHTML = SETS.filter(s => owned(s) === 3).slice(0, 6).map(s => {
    const miss = s.pieces.find(p => !p.owned);
    return `<div class="close" title="Missing: ${esc(miss.name)}">${img(miss.id)}<span class="n">${esc(s.name)}</span><span style="color:var(--inkMuted)">3/4</span></div>`;
  }).join('') || '<div style="color:var(--inkMuted)">No set is one piece away.</div>';

  const classes = [...new Set(SETS.map(s => s.cls))].sort();
  document.getElementById('byclass').innerHTML = classes.map(c => {
    const of = SETS.filter(s => s.cls === c), d = of.filter(s => owned(s) === 4).length;
    return `<div class="clsrow"><span><span class="sq" style="background:${CLASS_COLORS[c] || '#645D4E'}"></span> ${c}</span>
      <span>${d}/${of.length}</span><div class="bar"><i style="width:${100 * d / of.length}%"></i></div></div>`;
  }).join('');
}

const fEl = document.getElementById('filter');
['All', 'Complete', 'In progress', 'Missing'].forEach(f => {
  const b = document.createElement('button'); b.textContent = f; if (f === filter) b.className = 'on';
  b.onclick = () => { filter = f; [...fEl.children].forEach(x => x.className = x === b ? 'on' : ''); render(); };
  fEl.appendChild(b);
});
const cEl = document.getElementById('cls');
['All classes', ...[...new Set(SETS.map(s => s.cls))].sort()].forEach(c => cEl.add(new Option(c, c)));
cEl.onchange = () => { cls = cEl.value; render(); };
const tEl = document.getElementById('theme');
Object.keys(THEMES).forEach(t => tEl.add(new Option(t, t)));
tEl.onchange = () => THEMES[tEl.value].forEach((v, i) => document.documentElement.style.setProperty('--' + VARS[i], v));
render();
</script>
</body>
</html>
