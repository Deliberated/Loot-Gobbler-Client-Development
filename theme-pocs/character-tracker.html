<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Tracker POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F3EBD3; --sand:#E6D9B4; --header:#D8C690; --line:#A89150; --ink:#2E2412; --inkSoft:#6B5526; --inkMuted:#9C8656;
          --accent:#C8901C; --accentDark:#8A6210; --onAccent:#000; --red:#C2344E; --title:#FBF5E4; --titleFg:#6B5526; --outside:#3F2716; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--outside); font-family: 'VT323', monospace; font-size: 17px; color: var(--ink); }
  .px { font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .note { max-width: 1120px; margin: 0 auto 10px; color: #f3ebd3; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .note select { font-family: inherit; font-size: 16px; }
  .window { max-width: 1120px; margin: 0 auto; border: 1px solid var(--line); background: var(--sand); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .titlebar { display: flex; gap: 14px; padding: 6px 12px; background: var(--title); color: var(--titleFg); }
  .titlebar .t { flex: 1; text-align: center; font-size: 18px; }
  .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tab { padding: 8px 12px; border-right: 1px solid #000; color: var(--inkSoft); white-space: nowrap; }
  .tab.on { background: var(--paper); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .wrap { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .seg { display: flex; }
  .seg button { font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: .08em; padding: 5px 10px; border: 1px solid var(--line);
                background: var(--paper); color: var(--inkSoft); cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--onAccent); border-color: #000; }
  .muted { color: var(--inkMuted); }
  .cols { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .section { border: 1px solid var(--line); background: var(--paper); min-width: 0; display: flex; flex-direction: column; }
  .main { flex: 1 1 520px; }
  .side { flex: 1 1 420px; }
  .head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--header); border-bottom: 1px solid var(--line); color: var(--inkSoft); }
  .sq { width: 8px; height: 8px; display: inline-block; flex: none; }
  .list { padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 600px; overflow-y: auto; }
  .group { color: var(--inkMuted); margin: 4px 0 0; }
  .char { display: grid; grid-template-columns: 56px 1fr auto; gap: 4px 12px; align-items: center; padding: 6px 10px 6px 4px;
          background: var(--header); border: 1px solid #000; cursor: pointer; }
  .char:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .char.sel { background: color-mix(in srgb, var(--accent) 30%, var(--header)); outline: 2px solid var(--accent); outline-offset: -2px; }
  .char img { width: 48px; height: 48px; image-rendering: pixelated; grid-row: span 2; justify-self: center; }
  .name { font-size: 19px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lock { font-size: 15px; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { padding: 0 5px; border: 1px solid #000; font-family: 'Silkscreen', monospace; font-size: 8px; letter-spacing: .06em; line-height: 15px; }
  .tag.seasonal { background: #3C9347; color: #fff; }
  .tag.crucible { background: #E0702B; color: #000; }
  .tag.ritual { background: #7A1020; color: #FFD5DC; }
  .meta { color: var(--inkSoft); font-size: 15px; display: flex; gap: 14px; flex-wrap: wrap; }
  .fame { color: var(--accent); }
  .right { text-align: right; }
  .stat8 { font-size: 22px; }
  .stat8.max { color: var(--accent); }
  .ago { color: var(--inkMuted); font-size: 14px; }
  .panel { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .who { display: flex; gap: 12px; align-items: center; }
  .who img { width: 64px; height: 64px; image-rendering: pixelated; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--header); border: 1px solid var(--line); padding: 6px 8px; }
  .kpi b { display: block; font-size: 24px; font-weight: normal; color: var(--accent); }
  svg { width: 100%; height: 220px; background: var(--sand); border: 1px solid var(--line); }
  .sessions { display: flex; flex-direction: column; gap: 4px; max-height: 190px; overflow-y: auto; }
  .session { display: flex; justify-content: space-between; padding: 3px 8px; background: var(--header); }
  .session:nth-child(even) { background: var(--sand); }
  .gain { color: #3C9347; }
  .status { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; background: var(--line); }
  .status .grow { flex: 1; }
  .status button { font-family: 'Silkscreen', monospace; font-size: 10px; padding: 5px 10px; border: 1px solid #000; background: var(--accent); color: var(--onAccent); }
</style>
</head>
<body>
<div class="note">
  <b>Character Tracker POC</b> &mdash; real class sprites; characters, fame and dates are sample data.
  <label>Theme <select id="theme"></select></label>
</div>
<div class="window">
  <div class="titlebar"><span>File</span><span>Edit</span><span>Info</span><span class="t">Loot Gobbler by Pluri</span><span>&#x2013; &#x25A1; &#x2715;</span></div>
  <div class="tabs px"><span class="tab">Chat</span><span class="tab">Collection</span><span class="tab on">Characters</span><span class="tab">Discord</span><span class="tab">DPS Logger</span><span class="tab">Statistics</span><span class="tab">Settings</span></div>
  <div class="wrap">
    <div class="toolbar">
      <span class="px muted">Played in the last</span>
      <div class="seg" id="range"></div>
      <span class="muted" id="count"></span>
    </div>
    <div class="cols">
      <div class="section main">
        <div class="head px"><span class="sq" style="background:var(--accent)"></span>Characters</div>
        <div class="list" id="list"></div>
      </div>
      <div class="section side">
        <div class="head px"><span class="sq" style="background:#3C9347"></span>Fame Gain</div>
        <div class="panel" id="panel"></div>
      </div>
    </div>
  </div>
  <div class="status px"><span class="sq" style="background:#3C9347;width:10px;height:10px"></span><span class="grow">Sniffing</span><button>Stop sniffer</button></div>
</div>

const H = 3600e3, NOW = Date.now();
const RANGES = {'1H': H, '1D': 24 * H, '1W': 168 * H, '1M': 720 * H, 'ALL': Infinity};
// sample characters: lastPlayed = hours ago; fame history built from sessions
const CHARS = [
  {id: 1, cls: 'Necromancer', lvl: 20, fame: 18420, stats: 8, fav: true, seasonal: false, crucible: false, ritual: true, ago: 0.2},
  {id: 2, cls: 'Knight', lvl: 20, fame: 9310, stats: 7, fav: true, seasonal: false, crucible: false, ritual: false, ago: 30},
  {id: 3, cls: 'Mystic', lvl: 20, fame: 4405, stats: 6, fav: false, seasonal: true, crucible: true, ritual: false, ago: 0.8},
  {id: 4, cls: 'Wizard', lvl: 20, fame: 2210, stats: 5, fav: false, seasonal: true, crucible: false, ritual: false, ago: 5},
  {id: 5, cls: 'Paladin', lvl: 20, fame: 12880, stats: 8, fav: true, seasonal: false, crucible: true, ritual: false, ago: 80},
  {id: 6, cls: 'Huntress', lvl: 17, fame: 640, stats: 2, fav: false, seasonal: true, crucible: false, ritual: true, ago: 20},
  {id: 7, cls: 'Samurai', lvl: 20, fame: 7020, stats: 4, fav: false, seasonal: false, crucible: false, ritual: false, ago: 400},
  {id: 8, cls: 'Bard', lvl: 20, fame: 3330, stats: 3, fav: false, seasonal: false, crucible: true, ritual: false, ago: 140},
];
// sessions per character: [startHoursAgo, durationHours, fameGained]
for (const c of CHARS) {
  let seed = c.id * 9301 + 49297, rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  c.sessions = [];
  let t = c.ago + 0.1;
  for (let i = 0; i < 9; i++) {
    const dur = 0.4 + rnd() * 2.2, gained = Math.round(dur * (180 + rnd() * 900));
    c.sessions.push({start: t + dur, dur, gained});
    t += dur + 3 + rnd() * 60;
  }
}
const THEMES = {
  'Gobbler Gold':   ['#F3EBD3','#E6D9B4','#D8C690','#A89150','#2E2412','#6B5526','#9C8656','#C8901C','#8A6210','#000000','#C2344E','#FBF5E4','#6B5526','#3F2716'],
  'Goblin Green':   ['#1F2A17','#172012','#2B3A1F','#4A5E33','#E8F0D2','#B5C78E','#7F8F62','#A8C94A','#6F8F2A','#10170B','#E05A6A','#10170B','#B5C78E','#0B1007'],

  'Burlap Sack':    ['#E9D8B8','#D7BF94','#C4A574','#8B6A3E','#2C1D0E','#5E4122','#8C6C47','#6F9A2B','#4C6E18','#FFFFFF','#B8364A','#F2E6CC','#5E4122','#5E3B1E'],
  'Gem Vault':      ['#261D33','#1C1527','#332746','#54426E','#EFE6FA','#C3B2DC','#8E7DA8','#E5B23A','#A9771B','#140F1C','#D8285A','#140F1C','#C3B2DC','#0D0913'],
  'Goblin Burlap':  ['#E7D7B6','#D2BB8F','#B9C08A','#6F7F42','#22200F','#4E5A26','#857A55','#8DB33A','#5F7F1F','#10170B','#B8364A','#1F2A17','#C6DD6A','#2B3A1F'],
  'Amethyst Moss':  ['#24222B','#1B1A21','#2E3A22','#4D5A3A','#ECE6F2','#B5C78E','#8A8496','#B07BE0','#7A4BA8','#120D18','#E8607A','#121117','#B5C78E','#0C0B10'],
};
const VARS = ['paper','sand','header','line','ink','inkSoft','inkMuted','accent','accentDark','onAccent','red','title','titleFg','outside'];
let range = '1W', selected = 1;

const fmt = n => n.toLocaleString();
function ago(h) {
  if (h < 1) return Math.round(h * 60) + ' min ago';
  if (h < 24) return Math.round(h) + ' h ago';
  return Math.round(h / 24) + ' d ago';
}
const sprite = (cls, size) => SPRITES[cls] ? `<img src="data:image/png;base64,${SPRITES[cls]}" width="${size}" height="${size}" alt="">` : '';

function card(c) {
  const tags = [c.seasonal && '<span class="tag seasonal">Seasonal</span>', c.crucible && '<span class="tag crucible">Crucible</span>',
                c.ritual && '<span class="tag ritual">Blood Ritual</span>'].filter(Boolean).join('');
  return `<div class="char${c.id === selected ? ' sel' : ''}" onclick="selected=${c.id};render()">
    ${sprite(c.cls, 48)}
    <div class="name">${c.fav ? '<span class="lock" title="Favourited in-game">&#128274;</span>' : ''}${c.cls} <span class="muted">lvl ${c.lvl}</span> <span class="tags">${tags}</span></div>
    <div class="right"><span class="stat8${c.stats === 8 ? ' max' : ''}" title="Stats maxed">${c.stats}/8</span></div>
    <div class="meta"><span class="fame">&#9733; ${fmt(c.fame)} fame</span></div>
    <div class="right ago">${ago(c.ago)}</div>
  </div>`;
}

function render() {
  const win = RANGES[range] / H;
  const shown = CHARS.filter(c => c.ago <= win);
  const favs = shown.filter(c => c.fav).sort((a, b) => a.ago - b.ago);
  const rest = shown.filter(c => !c.fav).sort((a, b) => a.ago - b.ago);
  document.getElementById('count').textContent = shown.length + ' of ' + CHARS.length + ' characters';
  document.getElementById('list').innerHTML =
    (favs.length ? '<div class="group px">Favourites</div>' + favs.map(card).join('') : '') +
    (rest.length ? '<div class="group px">Recently played</div>' + rest.map(card).join('') : '') ||
    '<div class="muted">No character played in this range.</div>';
  renderPanel(CHARS.find(c => c.id === selected));
}

function renderPanel(c) {
  const win = Math.min(RANGES[range] / H, 24 * 45);
  const sessions = c.sessions.filter(s => s.start - s.dur <= win);
  const gained = sessions.reduce((a, s) => a + s.gained, 0), hours = sessions.reduce((a, s) => a + s.dur, 0);
  // fame curve: walk sessions from oldest to newest inside the window
  const pts = [];
  let fame = c.fame - gained;
  pts.push([win, fame]);
  for (const s of [...sessions].reverse()) {
    pts.push([Math.min(win, s.start), fame]);
    fame += s.gained;
    pts.push([s.start - s.dur, fame]);
  }
  pts.push([0, c.fame]);
  const W = 400, Hh = 200, minF = pts[0][1], maxF = c.fame, span = Math.max(1, maxF - minF);
  const X = h => 30 + (1 - h / win) * (W - 40), Y = f => Hh - 20 - (f - minF) / span * (Hh - 40);
  const line = pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  const area = `30,${Hh - 20} ${line} ${X(0)},${Hh - 20}`;
  document.getElementById('panel').innerHTML = `
    <div class="who">${sprite(c.cls, 64)}<div><div class="name">${c.fav ? '&#128274; ' : ''}${c.cls} <span class="muted">lvl ${c.lvl}</span></div>
      <div class="meta"><span class="fame">&#9733; ${fmt(c.fame)} fame</span><span>${c.stats}/8 stats</span><span>last played ${ago(c.ago)}</span></div></div></div>
    <div class="kpis">
      <div class="kpi px">Fame gained<b>+${fmt(gained)}</b></div>
      <div class="kpi px">Fame / hour<b>${hours ? fmt(Math.round(gained / hours)) : '-'}</b></div>
      <div class="kpi px">Time played<b>${hours.toFixed(1)} h</b></div>
    </div>
    <svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
      <polygon points="${area}" fill="var(--accent)" opacity=".18"/>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="30" y="${Hh - 6}" font-size="11" fill="var(--inkMuted)">${range === 'ALL' ? '45 d ago' : range + ' ago'}</text>
      <text x="${W - 30}" y="${Hh - 6}" font-size="11" fill="var(--inkMuted)">now</text>
      <text x="32" y="14" font-size="11" fill="var(--inkMuted)">${fmt(maxF)}</text>
    </svg>
    <div class="px muted">Sessions</div>
    <div class="sessions">${sessions.map(s => `<div class="session"><span>${new Date(NOW - s.start * H).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}
      &ndash; ${new Date(NOW - (s.start - s.dur) * H).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</span><span class="gain">+${fmt(s.gained)} fame</span></div>`).join('')
      || '<div class="muted">No sessions in this range.</div>'}</div>`;
}

const rEl = document.getElementById('range');
Object.keys(RANGES).forEach(r => {
  const b = document.createElement('button'); b.textContent = r; if (r === range) b.className = 'on';
  b.onclick = () => { range = r; [...rEl.children].forEach(x => x.className = x === b ? 'on' : ''); render(); };
  rEl.appendChild(b);
});
const tEl = document.getElementById('theme');
Object.keys(THEMES).forEach(t => tEl.add(new Option(t, t)));
tEl.onchange = () => THEMES[tEl.value].forEach((v, i) => document.documentElement.style.setProperty('--' + VARS[i], v));
render();
</script>
