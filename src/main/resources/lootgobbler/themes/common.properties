# Styling shared by all Loot Gobbler themes. Applied on top of each theme's palette file
# (LightLaf.properties, DarkLaf.properties, ...) via FlatLaf global extra defaults, see Themes.java.
# Fonts "Jersey 10" (headings) and "Jersey 15" (text) are bundled in /fonts and registered by Themes.init().

#---- Palette mapping ----
@background = @sand
@foreground = @ink
@disabledForeground = @inkMuted
@accentColor = @gold
@selectionBackground = @gold
@selectionForeground = @paper
@selectionInactiveBackground = @header
@selectionInactiveForeground = @ink
@textSelectionBackground = @textSel
@textSelectionForeground = @ink
@componentBackground = @paper
@menuBackground = @paper
@buttonBackground = @header

# Named colors for Java code (UIManager.getColor("LootGobbler.gold") etc.) and style classes
LootGobbler.paper = @paper
LootGobbler.sand = @sand
LootGobbler.header = @header
LootGobbler.line = @line
LootGobbler.ink = @ink
LootGobbler.muted = @inkMuted
LootGobbler.gold = @gold
LootGobbler.goldDark = @goldDark
LootGobbler.goldHover = @goldHover
LootGobbler.red = @red
LootGobbler.onAccent = @onAccent
LootGobbler.frame = @frame
LootGobbler.frameInk = @frameInk
LootGobbler.statusInk = @statusInk

#---- Fonts ----
defaultFont = 18 "Jersey 15"
TabbedPane.font = 17 "Jersey 10"
Button.font = 16 "Jersey 10"
ToggleButton.font = 16 "Jersey 10"
TableHeader.font = 16 "Jersey 10"
TitledBorder.font = 16 "Jersey 10"
TitlePane.font = 19 "Jersey 15"

#---- Shape: square, pixel-style ----
Component.arc = 0
Button.arc = 0
CheckBox.arc = 0
TextComponent.arc = 0
ProgressBar.arc = 0
ScrollBar.thumbArc = 0
ScrollBar.trackArc = 0
Component.focusWidth = 0
Component.innerFocusWidth = 1
Component.borderColor = @line
Component.focusedBorderColor = @gold
Component.focusColor = @gold
Button.margin = 2,10,2,10
ToggleButton.margin = 2,10,2,10

#---- Window title bar (menu bar embedded on Windows) ----
TitlePane.background = @title
TitlePane.inactiveBackground = @title
TitlePane.foreground = @titleFg
TitlePane.centerTitle = true
TitlePane.menuBarEmbedded = true
MenuBar.background = @title
MenuBar.borderColor = @line

#---- Menus ----
PopupMenu.background = @paper
PopupMenu.borderColor = @line
Menu.background = @paper
MenuItem.background = @paper
MenuItem.selectionBackground = @gold
MenuItem.selectionForeground = @paper
Menu.selectionBackground = @gold
Menu.selectionForeground = @paper
MenuItem.acceleratorForeground = @inkMuted
Separator.foreground = @line

#---- Tabs ----
TabbedPane.background = @frame
TabbedPane.foreground = @frameInk
TabbedPane.selectedBackground = @paper
TabbedPane.selectedForeground = @gold
TabbedPane.hoverColor = @header
TabbedPane.focusColor = @paper
TabbedPane.underlineColor = @gold
TabbedPane.inactiveUnderlineColor = @gold
TabbedPane.underlineHeight = 3
TabbedPane.tabHeight = 26
TabbedPane.tabInsets = 4,12,4,12
TabbedPane.showTabSeparators = true
TabbedPane.tabSeparatorsFullHeight = true
TabbedPane.tabSeparatorColor = #000000
TabbedPane.contentAreaColor = @line
TabbedPane.contentSeparatorHeight = 1

#---- Buttons ----
Button.background = @header
Button.foreground = @ink
Button.borderColor = #000000
Button.hoverBackground = @sand
Button.pressedBackground = @line
Button.focusedBorderColor = @gold
Button.default.background = @gold
Button.default.foreground = @onAccent
Button.default.borderColor = #000000
Button.default.hoverBackground = @goldHover
Button.default.pressedBackground = @goldDark
ToggleButton.background = @paper
ToggleButton.foreground = @inkSoft
ToggleButton.selectedBackground = @gold
ToggleButton.selectedForeground = @onAccent
ToggleButton.borderColor = @line

#---- Check boxes / radio buttons ----
CheckBox.icon = lootgobbler.ui.PixelCheckBoxIcon
CheckBox.icon.selectedBackground = @check
CheckBox.icon.checkmarkColor = @ink
RadioButton.icon.centerDiameter = 6

#---- Text components ----
TextArea.background = @paper
TextPane.background = @paper
EditorPane.background = @paper
TextField.background = @paper
FormattedTextField.background = @paper
PasswordField.background = @paper
ComboBox.background = @paper
Spinner.background = @paper
TextArea.foreground = @ink
TextField.placeholderForeground = @inkMuted

#---- Lists, tables, trees ----
List.background = @paper
Tree.background = @paper
Table.background = @paper
Table.alternateRowColor = @header
Table.gridColor = @header
Table.selectionBackground = @gold
Table.selectionForeground = @paper
TableHeader.background = @header
TableHeader.foreground = @inkSoft
TableHeader.separatorColor = @line
TableHeader.bottomSeparatorColor = @line
ScrollPane.background = @paper
Viewport.background = @paper

#---- Scroll bars ----
ScrollBar.track = @sand
ScrollBar.thumb = @line
ScrollBar.hoverThumbColor = @inkSoft
ScrollBar.pressedThumbColor = @ink
ScrollBar.width = 12
ScrollBar.showButtons = false

#---- Misc ----
ToolTip.background = @paper
ToolTip.foreground = @ink
ToolTip.border = 4,6,4,6,@line,1
TitledBorder.titleColor = @inkSoft
ProgressBar.foreground = @gold
ProgressBar.background = @line
ProgressBar.horizontalSize = 146,10
Slider.thumbColor = @gold
Slider.trackValueColor = @gold
Slider.trackColor = @line
Slider.focusedColor = fade(@gold,40%)
SplitPane.background = @sand
SplitPaneDivider.draggingColor = @gold
Label.disabledForeground = @inkMuted

#---- Style classes ----
[style]Label.statusBar = foreground: $LootGobbler.statusInk; font: 16 "Jersey 10"; border: 4,8,4,8
[style]Panel.statusBar = background: $LootGobbler.line
[style]Button.statusButton = background: $LootGobbler.gold; foreground: $LootGobbler.onAccent; borderColor: #000000; hoverBackground: $LootGobbler.goldHover; pressedBackground: $LootGobbler.goldDark; focusedBorderColor: #000000
[style]Button.primary = background: $LootGobbler.gold; foreground: $LootGobbler.onAccent; borderColor: #000000; hoverBackground: $LootGobbler.goldHover; pressedBackground: $LootGobbler.goldDark; focusedBorderColor: #000000
[style]Button.danger = foreground: $LootGobbler.red; borderColor: $LootGobbler.red; focusedBorderColor: $LootGobbler.red; background: $LootGobbler.paper
[style]Menu.titleMenu = foreground: $TitlePane.foreground
[style]Label.small =font: 16 "Jersey 10"; foreground: $LootGobbler.muted
